name: Versioned release builds

on:
  push:
    branches: [codex/versioned-release-builds]
    tags: ['v*', 'build-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-builds-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Python distributions and source snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install distribution builder
        run: python -m pip install 'build==1.3.0'
      - name: Check Python syntax
        run: python -m compileall -q apps bridges theorem_control theorem_ml
      - name: Build the wheel and source distribution
        run: python -m build --outdir release-assets
      - name: Package the complete source and build identity
        run: python scripts/release-assets.py --kind python
      - name: Retain versioned artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: django-theorem-${{ github.sha }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  draft-release:
    name: Attach successful packages to a draft prerelease
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: django-theorem-${{ github.sha }}
          path: release-assets
      - name: Create draft without replacing an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum --check SHA256SUMS
          gh release create "$RELEASE_TAG" ./* \
            --verify-tag --draft --prerelease --latest=false \
            --title "Django-Theorem $RELEASE_TAG" \
            --notes-file RELEASE-NOTES.md
